# R1, phase 2b — confirm the pasted link and add the app to the school.
#
# Run immediately after 025 + `adb shell input keyevent 279`, which pastes the
# manifest URL the Tangerine app copied into the focused Link field.
#
# The field's CONTENT is deliberately not asserted: it is a WebView EditText and
# Chromium does not expose an input's value through the Android accessibility
# tree, so a text assertion on it can never match (verified: the node reports
# text='' while the field is visibly populated - same as the login fields). The
# clipboard handoff is proven downstream instead - tapping Next with an empty or
# garbage value cannot produce the parsed "App detail" screen asserted below.
#
# Requires: nothing (the driver may pass nothing); the URL shape is:
#   https://<server>/respect-app-manifest/v2?respectToken=<uuid>
appId: world.respect.app
---
- assertVisible: "Enter link"

# Let the paste settle before tapping through (see the header note on why the
# field's value itself cannot be asserted).
- waitForAnimationToEnd
- tapOn: "Next"

# RESPECT parsed the manifest: the app's own title and its groups are shown.
# "App detail" is the app-bar title, exposed as the testTag "app_title".
- assertVisible:
    id: "app_title"
    text: "App detail"
- assertVisible: "Tangerine"
- assertVisible: "Group X"

# Add it to the school. 020 cleared the catalog, so this button must be here —
# without that precondition R1 could pass having added nothing at all.
# Both labels RESPECT has shipped for this button are accepted: the installed
# build renders "+ Add to school apps" (the leading "+" is part of the rendered
# text), while the build these flows were originally written against used
# "Add App". Matched case-insensitively with the "+"/whitespace optional.
- assertVisible: '(?i)^\+?\s*add( app| to school apps)$'
- tapOn: '(?i)^\+?\s*add( app| to school apps)$'

# Adding does NOT pop the stack: RESPECT stays on the detail screen. 025 pushed
# Home -> Select app -> Enter link -> App detail, so walk back out. Each tap is
# guarded by the button being present (this screen's back button is labelled
# "Back", NOT "Navigate up" as RESPECT's WebView toolbar is), so a build that
# returns Home by itself is harmless instead of an over-tap that exits the app.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Back"
          commands:
            - tapOn: "Back"

# The contract: the app is a tile on the Apps tab. This is only meaningful
# because 020 removed it first.
#
# Anchor on "Bookmarks": it exists only on Home, whereas a bare
# assertVisible "Tangerine" would also be satisfied by the App detail screen we
# are standing on - the assertion would then pass having proven nothing about
# the add.
- extendedWaitUntil:
    visible: "Bookmarks"
    timeout: 30000
- extendedWaitUntil:
    visible: "Tangerine"
    timeout: 30000
