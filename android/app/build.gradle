apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release/upload signing credentials live in android/keystore.properties (git-ignored).
// Without that file the release build stays unsigned (debug builds are unaffected).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseSigning = keystorePropsFile.exists()
if (hasReleaseSigning) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "org.tangerinecentral.tangerine"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.tangerinecentral.tangerine"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // `!*.map` strips the pdf.js source maps shipped inside the
            // @capacitor/inappbrowser AAR (~7.6 MB, DevTools-only), and `!*.bak`
            // guards against editor backups creeping back into www/.
            // Note: packagingOptions.resources.excludes does NOT apply to AAR
            // assets, so this aapt-level pattern is the mechanism that works.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.map:!*.bak'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // Play App Signing: the upload key signs the bundle, Google re-signs for distribution.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Play-distributed builds must never be debuggable.
            debuggable false
        }
    }
    bundle {
        language {
            // Ship all translations in the base module; the content/UI is fully
            // runtime-switchable and split language modules would strip strings
            // the WebView asks for at runtime.
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    dependenciesInfo {
        // Strip the Play-only dependency metadata block from the bundle manifest.
        includeInApk = false
        includeInBundle = false
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation project(':tangy-cache-plugin')
    // Old RESPECT cache library (UstadCache). Its shared helper modules (ihttp-core,
    // ihttp-iostreams, serializers, util) are provided instead by org.openeel.app:1.0.41 via the
    // TangyCache plugin's xAPI/IPC dependencies; excluding the old duplicates prevents
    // checkDebugDuplicateClasses failures.
    implementation('world.respect:respect-lib-cache-android:0.1.0-SNAPSHOT') {
        exclude group: 'world.respect', module: 'respect-lib-ihttp-core-android'
        exclude group: 'world.respect', module: 'respect-lib-ihttp-iostreams-android'
        exclude group: 'world.respect', module: 'respect-lib-serializers-android'
        exclude group: 'world.respect', module: 'respect-lib-util-android'
    }
    // kotlinx-io was previously exposed transitively by the excluded world.respect modules;
    // MainActivity's CachePaths code uses kotlinx.io.files.Path, so bring it in explicitly.
    implementation 'org.jetbrains.kotlinx:kotlinx-io-core:0.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    implementation 'androidx.room:room-runtime:2.8.2'
    implementation 'androidx.room:room-ktx:2.8.2'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
